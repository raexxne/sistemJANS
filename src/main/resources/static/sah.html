<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verifikasi Pas Kebenaran | JAS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    :root {
      --navy: #063b66;
      --blue: #0d6efd;
      --ink: #172b4d;
      --muted: #667085;
      --line: #e5eaf0;
      --surface: #ffffff;
      --soft-blue: #f2f7fc;
    }
    body {
      background: radial-gradient(circle at top right, #dceeff 0, transparent 34%), #eef3f8;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    .verify-card {
      width: min(1080px, 100%);
      overflow: hidden;
      border: 1px solid #d7e1ec;
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 18px 55px rgba(24, 55, 88, 0.14);
    }
    .verify-header {
      position: relative;
      padding: 28px clamp(20px, 5vw, 56px);
      color: #fff;
      background: linear-gradient(120deg, #063b66, #0d6efd);
      text-align: center;
    }
    .verify-header::after {
      content: '';
      position: absolute;
      right: 7%;
      bottom: -32px;
      width: 150px;
      height: 150px;
      border: 20px solid rgba(255,255,255,0.08);
      border-radius: 50%;
    }
    .verify-header h1 {
      position: relative;
      z-index: 1;
      font-size: clamp(1.35rem, 3vw, 2rem);
      letter-spacing: 0.01em;
    }
    .verify-header p { position: relative; z-index: 1; color: rgba(255,255,255,0.78); }
    .verify-body { padding: clamp(18px, 4vw, 42px); }
    .status-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 24px;
      padding: 18px 20px;
      border: 1px solid #b9e2c4;
      border-radius: 14px;
      background: #f0fbf3;
      text-align: center;
    }
    .status-banner > div {
      width: 100%;
    }
    .status-title { color: #176b35; font-weight: 700; }
    .status-reference { color: var(--muted); font-size: .9rem; }
    .verify-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge-passed { background: #d4edda; color: #155724; }
    .section-card {
      height: 100%;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface);
    }
    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      color: var(--navy);
      font-size: 1rem;
      font-weight: 700;
    }
    .section-title i { color: var(--blue); }
    .data-row {
      display: grid;
      grid-template-columns: minmax(150px, .8fr) minmax(0, 1.2fr);
      gap: 18px;
      padding: 11px 0;
      border-bottom: 1px solid #eef1f4;
    }
    .data-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .data-label { color: var(--muted); font-size: .78rem; font-weight: 600; }
    .data-value { color: var(--ink); font-size: .92rem; font-weight: 500; overflow-wrap: anywhere; white-space: pre-wrap; }
    .visitor-card {
      margin-top: 12px;
      padding: 14px;
      border: 1px solid #dce8f3;
      border-radius: 12px;
      background: var(--soft-blue);
    }
    .visitor-card:first-child { margin-top: 0; }
    .visitor-name { color: var(--navy); font-weight: 700; }
    .visitor-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; margin-top: 10px; }
    .visitor-field { min-width: 0; }
    .visitor-field span { display: block; color: var(--muted); font-size: .7rem; }
    .visitor-field strong { display: block; color: var(--ink); font-size: .84rem; overflow-wrap: anywhere; }

    @media (max-width: 576px) {
      .verify-card { border-radius: 14px; }
      .verify-body { padding: 16px; }
      .verify-header { padding: 22px 18px; }
      .status-banner { align-items: flex-start; flex-direction: column; padding: 15px; }
      .data-row {
        grid-template-columns: minmax(0, 1fr);
        gap: 3px;
        padding: 10px 0;
      }
      .section-card { padding: 15px; }
      .visitor-grid { grid-template-columns: minmax(0, 1fr); gap: 8px; }
    }
    
    @media print {
      body {
        background: white;
        padding: 0;
      }
      .verify-card {
        box-shadow: none;
        border: 2px solid #00467f;
      }
    }
  </style>
</head>
<body>

  <div class="verify-card">
    <div class="verify-header">
      <h1 class="mb-0">Verifikasi Pas Kebenaran</h1>
      <p class="mb-0 mt-2">Pengesahan kebenaran masuk</p>
    </div>
    
    <div class="verify-body">
      <div id="content" class="text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Memuatkan...</span>
        </div>
        <p class="mt-3 text-muted">Memproses data verifikasi...</p>
      </div>
    </div>
  </div>
  <script>
    function escapeHtml(text) {
      if (!text) return '';
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      };
      return String(text).replace(/[&<>"']/g, (c) => map[c]);
    }

    /** Padankan dengan telefonBimbit() di PermohonanService.java: phoneMobile, fallback ke phone legacy */
    function telefonBimbit(pass) {
      if (pass.phoneMobile && String(pass.phoneMobile).trim()) return pass.phoneMobile;
      if (pass.phone && String(pass.phone).trim()) return pass.phone;
      return '-';
    }

    /** Padankan dengan formatMasa() di PermohonanService.java: LocalTime "HH:mm:ss" -> 12 jam AM/PM */
    function formatMasa(visitTime) {
      if (!visitTime) return '-';
      const parts = String(visitTime).split(':');
      if (parts.length < 2) return visitTime;
      let h = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10);
      if (isNaN(h) || isNaN(m)) return visitTime;
      const period = h >= 12 ? 'PM' : 'AM';
      let h12 = h % 12;
      if (h12 === 0) h12 = 12;
      return `${String(h12).padStart(2, '0')}:${String(m).padStart(2, '0')} ${period}`;
    }

    function nilai(value) {
      return value !== null && value !== undefined && String(value).trim() ? value : '-';
    }

    function labelLokasi(type) {
      const labels = { LOJI: 'Loji', INTAKE: 'Intake' };
      return labels[type] || nilai(type);
    }

    function paparanTarikh(date) {
      if (!date) return '-';
      const parsed = new Date(`${date}T00:00:00`);
      return Number.isNaN(parsed.getTime()) ? date : parsed.toLocaleDateString('ms-MY', {
        day: '2-digit', month: 'long', year: 'numeric'
      });
    }

    function medan(label, value) {
      return `<div class="data-row"><div class="data-label">${label}</div><div class="data-value">${escapeHtml(nilai(value))}</div></div>`;
    }

    function medanPelawat(label, value) {
      return `<div class="visitor-field"><span>${label}</span><strong>${escapeHtml(nilai(value))}</strong></div>`;
    }

    async function apiFetch(url) {
      const res = await fetch(url, {
        headers: {
          'ngrok-skip-browser-warning': 'true'
        }
      });

      const contentType = res.headers.get('content-type') || '';

      if (!res.ok) {
        if (contentType.includes('application/json')) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.ralat || err.message || `Pas tidak ditemui atau tidak sah (status ${res.status})`);
        }
        throw new Error(`Pas tidak ditemui atau tidak sah (status ${res.status})`);
      }

      if (!contentType.includes('application/json')) {
        const bodyPreview = await res.text().catch(() => '');
        console.error('Respons bukan JSON. Content-Type:', contentType, 'Badan respons:', bodyPreview.slice(0, 300));
        throw new Error('Respons daripada server tidak sah.');
      }

      return res.json();
    }

    async function verifyPass() {
      const params = new URLSearchParams(location.search);
      const token = params.get('token');
      
      if (!token) {
        document.querySelector('#content').innerHTML = `
          <div class="alert alert-danger mt-3">
            <i class="fas fa-exclamation-triangle me-2"></i>
            Token verifikasi tidak ditemui
          </div>
        `;
        return;
      }

      try {
        const apiUrl = '/api/pas/' + encodeURIComponent(token);
        console.log('Fetching:', apiUrl);

        const pass = await apiFetch(apiUrl);

        const isValid = pass.status === 'PAS_DIKELUARKAN';
        const statusIcon = isValid ? 'fa-check-circle text-success' : 'fa-info-circle';
        const pelawat = Array.isArray(pass.pelawat) ? pass.pelawat : [];
        const statusText = isValid ? 'PAS SAH' : 'DALAM PROSES';
        
        document.querySelector('#content').innerHTML = `
          <div class="status-banner">
            <div>
              <div class="status-title"><i class="fas ${statusIcon} me-2"></i>${statusText}</div>
              <div class="status-reference mt-1">No. Permohonan: <strong>${escapeHtml(nilai(pass.nomborPermohonan))}</strong></div>
            </div>
          </div>

          <div class="row g-3 text-start">
            <div class="col-12">
              <section class="section-card">
                <h2 class="section-title"><i class="fas fa-file-lines"></i>Maklumat Permohonan</h2>
                ${medan('Tarikh permohonan', paparanTarikh(pass.applicationDate))}
                ${medan('Tarikh lawatan', paparanTarikh(pass.visitDate))}
                ${medan('Masa lawatan', formatMasa(pass.visitTime))}
                ${medan('Jenis lokasi', labelLokasi(pass.locationType))}
                ${medan('Nama / alamat lokasi', pass.locationName)}
                ${medan('Organisasi', pass.organisation)}
                ${medan('E-mel wakil', pass.emailWakil || pass.email)}
                ${medan('Telefon pejabat', pass.phoneOffice)}
                ${medan('Tujuan lawatan', pass.purpose)}
              </section>
            </div>
            <div class="col-12">
              <section class="section-card">
                <h2 class="section-title"><i class="fas fa-users"></i>Maklumat Pelawat <span class="badge text-bg-primary">${pelawat.length}</span></h2>
                ${pelawat.length ? pelawat.map((visitor, index) => `
                  <div class="visitor-card">
                    <div class="visitor-name"><i class="fas fa-user me-2"></i>Pelawat ${index + 1}: ${escapeHtml(nilai(visitor.namaPenuh))}</div>
                    <div class="visitor-grid">
                      ${medanPelawat('No. kad pengenalan', visitor.noKadPengenalan)}
                      ${medanPelawat('E-mel', visitor.email)}
                      ${medanPelawat('Telefon bimbit', visitor.noTelefonBimbit)}
                      ${medanPelawat('Jawatan', visitor.jawatan)}
                      ${medanPelawat('No. pendaftaran kenderaan', visitor.noPendaftaranKenderaan)}
                    </div>
                  </div>`).join('') : '<p class="text-muted mb-0">Tiada maklumat pelawat direkodkan.</p>'}
              </section>
            </div>
            ${(pass.staffNote || pass.directorNote) ? `
              <div class="col-12 col-lg-6">
                <section class="section-card">
                  <h2 class="section-title"><i class="fas fa-clipboard-check"></i>Catatan Proses</h2>
                  ${pass.staffNote ? medan('Catatan petugas', pass.staffNote) : ''}
                  ${pass.directorNote ? medan('Catatan pengarah', pass.directorNote) : ''}
                </section>
              </div>` : ''}
          </div>

        `;
      } catch (error) {
        console.error(error);
        document.querySelector('#content').innerHTML = `
          <div class="alert alert-danger mt-3">
            <i class="fas fa-times-circle me-2"></i>
            <strong>Ralat Verifikasi</strong><br>
            ${escapeHtml(error.message)}
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', verifyPass);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
