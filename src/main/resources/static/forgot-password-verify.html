<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sahkan Kod Reset | JAS</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <main class="auth-main">
    <div class="auth-shell">
      <section class="auth-form-panel" aria-label="Borang pengesahan kod reset">
        <div class="auth-brand">
        </div>
        <h1 class="auth-title">Pengesahan Kod 6 Digit</h1>
        <p class="auth-subtitle">Masukkan e-mel dan kod 6 digit untuk menetapkan semula kata laluan anda.</p>

        <div id="mesej-verify"></div>

        <form id="borang-verify-kod" class="auth-form">
          <div class="mb-3">
            <label for="email-verify" class="form-label fw-medium">E-mel Akaun</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-envelope"></i></span>
              <input id="email-verify" name="email" type="email" class="form-control" placeholder="email@contoh.com" required>
            </div>
          </div>

          <div class="mb-3">
            <label for="kod-verify" class="form-label fw-medium">Kod 6 Digit</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-key"></i></span>
              <input id="kod-verify" name="kod" type="text" class="form-control" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" placeholder="Contoh: 123456" required>
            </div>
            <small class="text-muted">Kod sah selama 10 minit.</small>
          </div>

          <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
            <i class="fas fa-check-circle me-2"></i> Sahkan Kod & Reset
          </button>
        </form>

        <div class="text-center">
          <a href="/forgot-password.html" class="auth-link small d-block mb-2">Tidak menerima kod pengesahan?</a>
          <a href="/login.html" class="text-muted small auth-link">Kembali ke Log Masuk</a>
        </div>
      </section>

      <!-- Panel Visual dengan logo dan kandungan di tengah (Center) -->
      <aside class="auth-visual-panel d-flex flex-column align-items-center justify-content-center text-center" aria-label="Maklumat pengesahan kod reset">
        <div class="auth-logo-wrapper mb-3">
          <img src="images/logo3.png" alt="Logo JAS" class="img-fluid auth-logo" style="max-height: 120px;">
        </div>

        <h2 class="auth-visual-title">Sahkan Akses Anda</h2>
        <p class="auth-visual-copy">Masukkan kod yang dihantar ke e-mel anda untuk melengkapkan proses pemulihan akses sistem.</p>
        <ul class="auth-visual-list">
        </ul>
      </aside>
    </div>
  </main>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const emailDariURL = (params.get('email') || '').trim().toLowerCase();
      const inputEmail = document.querySelector('#email-verify');
      if (emailDariURL && inputEmail) {
        inputEmail.value = emailDariURL;
      }
    })();

    document.querySelector('#borang-verify-kod').onsubmit = async function (e) {
      e.preventDefault();
      const email = document.querySelector('#email-verify').value.trim().toLowerCase();
      const kod = document.querySelector('#kod-verify').value.trim();
      const mesej = document.querySelector('#mesej-verify');

      if (!/^\d{6}$/.test(kod)) {
        mesej.innerHTML = `
          <div class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            Kod mesti 6 digit nombor.
          </div>
        `;
        return;
      }

      try {
        const r = await fetch('/api/public/forgot-password/verify-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, kod })
        });

        const result = await r.json().catch(() => ({}));
        if (!r.ok) {
          throw new Error(result.ralat || 'Pengesahan kod gagal diproses.');
        }

        mesej.innerHTML = `
          <div class="alert alert-success" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            ${result.mesej || 'Kod disahkan. Kata laluan baharu telah dihantar ke e-mel anda.'}
          </div>
        `;
        e.target.reset();
      } catch (err) {
        mesej.innerHTML = `
          <div class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            ${err.message}
          </div>
        `;
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
