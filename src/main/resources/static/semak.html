<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semak Status | JANS</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="blue-page d-flex flex-column min-vh-100">

  <main class="flex-grow-1 py-5">
    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow border-0 rounded-4 form-card">
            <div class="card-body p-5">
              <div class="mb-4">
                <a href="/index.html" class="text-primary fw-semibold text-decoration-none">
                  <i class="fas fa-arrow-left me-2"></i>Kembali ke halaman utama
                </a>
              </div>
              <div class="text-center mb-5">
                <i class="fas fa-search fa-3x text-primary mb-3"></i>
                <h1 class="h3 fw-bold">Semak Status Permohonan</h1>
                <p class="text-muted">Masukkan nombor permohonan anda untuk melihat status terkini.</p>
              </div>

              <div class="input-group input-group-lg mb-4">
                <span class="input-group-text"><i class="fas fa-ticket-alt"></i></span>
                <input 
                  id="no" 
                  type="text"
                  class="form-control"
                  placeholder="Contoh: JANS-2026-000001"
                >
                <button class="btn btn-primary px-4" onclick="semak()" type="button">
                  <i class="fas fa-search"></i> Semak
                </button>
              </div>

              <div id="hasil"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white py-4 text-center mt-auto">
    <div class="container-fluid">
      <p class="mb-0">&copy; 2026 Jabatan Air Negeri Sabah (JANS). Semua hak dilindungi.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
