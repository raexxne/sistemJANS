<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lupa Kata Laluan | JAS</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <main class="auth-main">
    <div class="auth-shell">
      <section class="auth-form-panel" aria-label="Borang lupa kata laluan">
        <div class="auth-brand">
        </div>
        <h1 class="auth-title">Lupa Kata Laluan</h1>
        <p class="auth-subtitle">Masukkan e-mel anda untuk menerima kod pengesahan 6 digit.</p>

        <div id="mesej-reset"></div>

        <form id="borang-reset-email" class="auth-form">
          <div class="mb-4">
            <label for="email-reset" class="form-label fw-medium">E-mel Akaun</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-envelope"></i></span>
              <input id="email-reset" name="email" type="email" class="form-control" placeholder="email@contoh.com" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
            <i class="fas fa-paper-plane me-2"></i> Hantar Kod 6 Digit
          </button>
        </form>

        <div class="text-center mb-2">
          <a href="/forgot-password-verify.html" class="auth-link small">Sudah ada kod? Teruskan ke pengesahan</a>
        </div>
        <div class="text-center">
          <a href="/login.html" class="text-muted small auth-link">Kembali ke Log Masuk</a>
        </div>
      </section>

      <!-- Panel Visual dengan logo dan teks diselaraskan di tengah (Center) -->
      <aside class="auth-visual-panel d-flex flex-column align-items-center justify-content-center text-center" aria-label="Maklumat reset kata laluan">
        <div class="auth-logo-wrapper mb-3">
          <img src="images/logo3.png" alt="Logo JAS" class="img-fluid auth-logo" style="max-height: 120px;">
        </div>

        <h2 class="auth-visual-title">Reset Kata Laluan</h2>
        <p class="auth-visual-copy">Sahkan identiti anda dan teruskan ke langkah seterusnya untuk menetapkan semula akses anda.</p>
        <ul class="auth-visual-list">
        </ul>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.querySelector('#borang-reset-email').onsubmit = async function (e) {
      e.preventDefault();
      const email = document.querySelector('#email-reset').value.trim().toLowerCase();
      const mesej = document.querySelector('#mesej-reset');

      try {
        const r = await fetch('/api/public/forgot-password/request-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const result = await r.json().catch(() => ({}));
        if (!r.ok) {
          throw new Error(result.ralat || 'Permintaan reset gagal diproses.');
        }

        mesej.innerHTML = `
          <div class="alert alert-success" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            ${result.mesej || 'Jika e-mel didaftarkan, kod 6 digit telah dihantar. Anda akan dibawa ke halaman pengesahan.'}
          </div>
        `;

        window.setTimeout(function () {
          window.location.href = '/forgot-password-verify.html?email=' + encodeURIComponent(email);
        }, 900);
      } catch (err) {
        mesej.innerHTML = `
          <div class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            ${err.message}
          </div>
        `;
      }
    };
  </script>
</body>
</html>
