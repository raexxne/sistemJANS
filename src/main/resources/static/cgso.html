<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CGSO | JAS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="internal-portal d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top internal-nav">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold fs-3 d-flex align-items-center" href="cgso.html">
        <img src="images/logo3.png" alt="Logo JAS" style="height: 60px; width: auto; margin-right: 14px;">
        <span class="d-flex flex-column align-items-start">
          <span class="fw-bold" style="font-size: 1.6rem; line-height: 1;">JAS</span>
          <span class="text-white-50" style="font-size: 0.8rem; line-height: 1.1; letter-spacing: 0.04em; margin-top: 3px;">Jabatan Air Sabah</span>
        </span>
      </a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <a href="profile.html" class="d-flex align-items-center gap-2 text-decoration-none" style="cursor: pointer;">
          <img id="navProfilePic" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%23e9ecef'/%3E%3Ccircle cx='100' cy='60' r='35' fill='%236c757d'/%3E%3Cellipse cx='100' cy='150' rx='50' ry='45' fill='%236c757d'/%3E%3C/svg%3E" alt="Profil" class="rounded-circle" style="width: 36px; height: 36px; object-fit: cover; border: 2px solid white;">
          <span id="navUsername" class="text-light fw-500" style="font-size: 14px;"></span>
        </a>
        <form method="post" action="logout" class="d-inline">
          <button type="submit" class="btn btn-outline-light btn-sm">Log keluar</button>
        </form>
      </div>
    </div>
  </nav>
  <main class="container-fluid flex-grow-1 p-4">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
        <div>
          <h1 class="h5 mb-1">Senarai Permohonan Untuk CGSO</h1>
          <p class="text-muted mb-0 small">Permohonan dihantar oleh petugas untuk semakan awal.</p>
        </div>
        <span class="badge bg-primary fs-6" id="jumlah">0 permohonan</span>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>No. Permohonan</th>
                <th>Organisasi</th>
                <th>Lokasi</th>
                <th>Tarikh Lawatan</th>
                <th class="text-center">Tindakan</th>
              </tr>
            </thead>
            <tbody id="senarai"><tr><td colspan="5" class="text-center text-muted">Memuatkan...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h2 class="modal-title fs-5" id="detailTitle">Butiran Permohonan</h2>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="detailBody"></div>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline-danger rounded-circle d-inline-flex align-items-center justify-content-center" id="btnPdf" title="Muat turun PDF" aria-label="Muat turun PDF" style="width:44px;height:44px;">
              <i class="fas fa-file-pdf"></i>
            </button>
            <button type="button" class="btn btn-primary rounded-circle d-inline-flex align-items-center justify-content-center" id="btnHantarKpp" title="Hantar ke KPP Cawangan Pengeluaran" aria-label="Hantar ke KPP Cawangan Pengeluaran" style="width:44px;height:44px;">
              <i class="fas fa-paper-plane"></i>
            </button>
        </div>
      </div>

      <div class="modal fade" id="pdfModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered" style="height:90vh;">
          <div class="modal-content h-100">
            <div class="modal-header">
              <h2 class="modal-title fs-6" id="pdfModalTitle">Dokumen Sokongan</h2>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
            </div>
            <div class="modal-body p-0">
              <iframe id="pdfFrame" title="Pratonton dokumen sokongan" style="width:100%;height:100%;border:0;"></iframe>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/csrf.js"></script>
  <script>
    let pilihan = null;
    const modal = () => bootstrap.Modal.getOrCreateInstance(document.getElementById('detailModal'));

    function showLoadingPopover() {
      document.querySelector('#cgso-processing-popover')?.remove();
      const popover = document.createElement('div');
      popover.id = 'cgso-processing-popover';
      popover.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);z-index:5000;display:flex;align-items:center;justify-content:center;padding:16px;';
      popover.innerHTML = `
        <div class="bg-white text-center p-4 shadow" style="width:100%;max-width:360px;border-radius:12px;">
          <img src="images/water-drops.gif" alt="Memuatkan" class="mb-3" style="width:72px;height:72px;object-fit:contain;">
          <p class="mb-0 fw-semibold text-dark">Memuatkan, sila tunggu...</p>
        </div>
      `;
      document.body.appendChild(popover);
      return () => popover.remove();
    }

    function showNotifyModal({
      title = 'Makluman',
      message = '',
      imageSrc = '',
      type = 'success'
    } = {}) {
      return new Promise((resolve) => {
        document.querySelector('#cgso-notify-modal')?.remove();
        const overlay = document.createElement('div');
        overlay.id = 'cgso-notify-modal';
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);z-index:5100;display:flex;align-items:center;justify-content:center;padding:16px;';
        const headerClass = type === 'error' ? 'bg-danger' : type === 'warning' ? 'bg-warning text-dark' : 'bg-success';
        const buttonClass = type === 'error' ? 'btn-danger' : type === 'warning' ? 'btn-warning text-dark' : 'btn-success';
        overlay.innerHTML = `
          <div class="bg-white shadow" role="dialog" aria-modal="true" style="width:100%;max-width:430px;border-radius:12px;overflow:hidden;">
            <div class="${headerClass} text-white px-4 py-3 fw-bold text-center">${title}</div>
            <div class="text-center px-4 py-4">
              ${imageSrc
                ? `<img src="${imageSrc}" alt="${title}" class="mb-3" style="width:72px;height:72px;object-fit:contain;">`
                : `<i class="fas ${type === 'error' ? 'fa-circle-exclamation' : 'fa-check-circle'} mb-3 ${type === 'error' ? 'text-danger' : 'text-success'}" style="font-size:3rem;"></i>`}
              <p class="mb-0" style="line-height:1.6;">${message}</p>
            </div>
            <div class="d-flex justify-content-center px-4 pb-4">
              <button type="button" class="btn ${buttonClass}" id="cgso-notify-ok">OK</button>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);
        const close = () => {
          overlay.remove();
          resolve(true);
        };
        overlay.querySelector('#cgso-notify-ok').addEventListener('click', close);
        overlay.addEventListener('click', (event) => {
          if (event.target === overlay) close();
        });
      });
    }

    document.getElementById('pdfModal')?.addEventListener('hidden.bs.modal', () => {
      const frame = document.getElementById('pdfFrame');
      if (frame?.dataset.pdfUrl) {
        URL.revokeObjectURL(frame.dataset.pdfUrl);
        delete frame.dataset.pdfUrl;
      }
      frame.src = 'about:blank';
    });
    const esc = (value) => String(value ?? '-').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    async function muatProfil() {
      const r = await fetch('api/profile');
      if (r.ok) document.getElementById('navUsername').textContent = (await r.json()).name || '';
      const img = document.getElementById('navProfilePic');
      fetch('api/profile/picture')
        .then(response => {
          if (response.ok) img.src = 'api/profile/picture?t=' + Date.now();
        })
        .catch(() => {});
    }
    async function muatSenarai() {
      const r = await fetch('api/cgso/permohonan');
      const list = r.ok ? await r.json() : [];
      document.getElementById('jumlah').textContent = `${list.length} permohonan`;
      const tbody = document.getElementById('senarai');
      tbody.innerHTML = '';
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Tiada permohonan menunggu semakan CGSO.</td></tr>';
        return;
      }
      list.forEach(p => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="fw-semibold">${esc(p.nomborPermohonan)}</td>
          <td>${esc(p.organisation)}</td>
          <td>${esc(p.locationName)}</td>
          <td>${esc(p.visitDate)}</td>
          <td class="text-center"><button class="btn btn-sm btn-outline-primary" title="Lihat butiran"><i class="fas fa-eye"></i></button></td>`;
        tr.querySelector('button').addEventListener('click', () => lihat(p));
        tbody.appendChild(tr);
      });
    }
    async function lihat(p) {
      pilihan = p;
      document.getElementById('detailTitle').textContent = `Butiran ${p.nomborPermohonan || '-'}`;
      try {
        const detailRes = await fetch(`api/cgso/permohonan/${encodeURIComponent(p.id)}`);
        if (detailRes.ok) pilihan = await detailRes.json();
        const pelawatRes = await fetch(`api/cgso/permohonan/${encodeURIComponent(p.id)}/pelawat`);
        if (pelawatRes.ok) pilihan.pelawat = await pelawatRes.json();
      } catch (error) {
        console.warn('Gagal memuat butiran CGSO lengkap', error);
      }
      p = pilihan;
      const jenisLokasi = String(p.locationType || '').toUpperCase() === 'INTAKE' ? 'Muka Sauk' : 'Loji';
      const pelawat = (p.pelawat || []).map((x,i) => {
        const identiti = x.jenisPengenalanDiri === 'PASPORT'
          ? `<strong>Jenis Pengenalan:</strong> Pasport<br><strong>Pasport / Permit:</strong> ${esc(x.noPermitKerja)}<br><strong>Warganegara:</strong> ${esc(x.warganegara)}`
          : `<strong>Jenis Pengenalan:</strong> Kad Pengenalan<br><strong>No. Kad Pengenalan:</strong> ${esc(x.noKadPengenalan)}`;
        return `
          <div class="col-md-6">
            <div class="border rounded p-3 h-100 bg-light">
              <h3 class="h6 fw-bold text-primary mb-3">Pelawat ${i + 1}</h3>
              <div><strong>Nama Penuh:</strong> ${esc(x.namaPenuh)}</div>
              ${identiti}
              <div><strong>E-mel:</strong> ${esc(x.email)}</div>
              <div><strong>No. Telefon (Bimbit):</strong> ${esc(x.noTelefonBimbit)}</div>
              <div><strong>Jawatan:</strong> ${esc(x.jawatan)}</div>
              <div><strong>No. Pendaftaran Kenderaan:</strong> ${esc(x.noPendaftaranKenderaan)}</div>
            </div>
          </div>`;
      }).join('');
      const dokumen = p.dokumenSokonganNama
        ? `<div class="mt-2 d-flex align-items-center gap-2">
             <i class="fas fa-file-pdf text-danger"></i>
             <span>${esc(p.dokumenSokonganNama)}</span>
             <button type="button" class="btn btn-sm btn-outline-primary" id="btnLihatDokumen" title="Lihat dokumen sokongan" aria-label="Lihat dokumen sokongan"><i class="fas fa-eye"></i></button>
           </div>`
        : '<div class="text-muted">Tiada dokumen sokongan</div>';
      document.getElementById('detailBody').innerHTML = `
        <div class="row g-3">
          <div class="col-12"><h3 class="h6 border-bottom pb-2 fw-bold">Maklumat Permohonan</h3></div>
          <div class="col-md-4"><strong>No. Permohonan:</strong><div>${esc(p.nomborPermohonan)}</div></div>
          <div class="col-md-4"><strong>Tarikh Permohonan:</strong><div>${esc(p.applicationDate)}</div></div>
          <div class="col-md-4"><strong>Kementerian / Jabatan / Agensi / Universiti / Syarikat:</strong><div>${esc(p.organisation)}</div></div>
          <div class="col-md-4"><strong>No. Telefon (Pejabat):</strong><div>${esc(p.phoneOffice)}</div></div>
          <div class="col-md-4"><strong>E-mel Untuk Dihubungi (Wakil):</strong><div>${esc(p.emailWakil || p.email)}</div></div>
          <div class="col-md-4"><strong>Jenis Lokasi:</strong><div>${esc(jenisLokasi)}</div></div>
          <div class="col-md-4"><strong>Nama / Alamat Lokasi:</strong><div>${esc(p.locationName)}</div></div>
          <div class="col-md-4"><strong>Tarikh Lawatan:</strong><div>${esc(p.visitDate)}</div></div>
          <div class="col-md-4"><strong>Masa Lawatan:</strong><div>${esc(p.visitTime)}</div></div>
          <div class="col-12"><strong>Tujuan Lawatan:</strong><div>${esc(p.purpose)}</div></div>
          <div class="col-12"><strong>Dokumen Sokongan:</strong>${dokumen}</div>
          <div class="col-12"><strong>Catatan Petugas:</strong><div class="border rounded p-2 bg-light">${esc(p.staffNote)}</div></div>
          <div class="col-12"><h3 class="h6 border-bottom pb-2 fw-bold mt-2">Maklumat Pelawat</h3></div>
          ${pelawat || '<div class="col-12 text-muted">Tiada rekod pelawat</div>'}
          <div class="col-12">
            <div class="d-flex align-items-center gap-2 mt-2">
              <label class="form-label fw-semibold mb-0">Komen CGSO</label>
              <button type="button" class="btn btn-sm btn-primary rounded-circle d-inline-flex align-items-center justify-content-center" id="btnTambahKomen" title="Tambah komen CGSO" aria-label="Tambah komen CGSO" style="width:32px;height:32px;">
                <i class="fas fa-plus"></i>
              </button>
            </div>
            <div id="komenCgsoBox" class="${p.cgsoNote ? '' : 'd-none'} mt-2">
              <textarea class="form-control" id="komenCgso" rows="4" placeholder="Nyatakan komen atau semakan CGSO...">${esc(p.cgsoNote)}</textarea>
            </div>
          </div>
        </div>`;
      document.getElementById('btnLihatDokumen')?.addEventListener('click', () => {
        if (!p.id) return;
        fetch(`api/cgso/permohonan/${encodeURIComponent(p.id)}/dokumen-sokongan?disposition=inline`, {
          credentials: 'same-origin',
          cache: 'no-store'
        }).then(async (response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const blob = await response.blob();
          if (blob.type !== 'application/pdf') throw new Error('Dokumen bukan PDF');

          const pdfUrl = URL.createObjectURL(blob);
          document.getElementById('pdfModalTitle').textContent =
            p.dokumenSokonganNama || 'Dokumen Sokongan';
          document.getElementById('pdfFrame').src = pdfUrl;
          document.getElementById('pdfFrame').dataset.pdfUrl = pdfUrl;
          bootstrap.Modal.getOrCreateInstance(document.getElementById('pdfModal')).show();
        }).catch(async (error) => {
          console.error('Gagal pratonton dokumen sokongan', error);
          alert('Dokumen sokongan tidak dapat dipratonton buat masa ini.');
        });
      });
      document.getElementById('btnTambahKomen')?.addEventListener('click', () => {
        document.getElementById('komenCgsoBox')?.classList.remove('d-none');
        document.getElementById('komenCgso')?.focus();
      });
      modal().show();
    }
    document.getElementById('btnPdf').addEventListener('click', () => {
      if (pilihan) window.location.href = `api/cgso/permohonan/${pilihan.id}/pdf`;
    });
    document.getElementById('btnHantarKpp').addEventListener('click', async () => {
      if (!pilihan) return;
      const komen = document.getElementById('komenCgso')?.value.trim() || '';
      const closeLoading = showLoadingPopover();
      await new Promise((resolve) => requestAnimationFrame(resolve));
      let r;
      let result = {};
      try {
        r = await fetch(`api/cgso/permohonan/${pilihan.id}/hantar-kpp`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({catatan: komen})
        });
        result = await r.json().catch(() => ({}));
      } catch (error) {
        console.error('Gagal menghantar permohonan kepada KPP', error);
        closeLoading();
        await showNotifyModal({
          title: 'Gagal Menghantar',
          message: 'Permohonan gagal dihantar kepada KPP Cawangan Pengeluaran.',
          imageSrc: 'images/wrong-decision.gif',
          type: 'error'
        });
        return;
      }
      closeLoading();
      if (!r.ok) {
        await showNotifyModal({
          title: 'Gagal Menghantar',
          message: result.ralat || 'Permohonan gagal dihantar kepada KPP Cawangan Pengeluaran.',
          imageSrc: 'images/wrong-decision.gif',
          type: 'error'
        });
        return;
      }
      modal().hide();
      await muatSenarai();
      await showNotifyModal({
        title: 'Berjaya Dihantar',
        message: `Permohonan ${pilihan.nomborPermohonan || ''} berjaya dihantar kepada KPP Cawangan Pengeluaran.`,
        imageSrc: 'images/right-decision.gif',
        type: 'success'
      });
    });
    document.addEventListener('DOMContentLoaded', async () => { await muatProfil(); await muatSenarai(); });
  </script>
</body>
</html>
