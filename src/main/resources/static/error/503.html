<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>503 Perkhidmatan Tidak Tersedia | JAS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background-color: #f8f9fa; display: flex; flex-direction: column; min-height: 100vh; }
    .error-container { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    .error-code { font-size: 8rem; font-weight: 800; color: #082f49; line-height: 1; margin-bottom: 0; }
    .error-icon { font-size: 4rem; color: #0ea5e9; margin-bottom: 1rem; }
  </style>
</head>
<body>
  
  <main class="error-container">
    <div>
      <i class="fas fa-tools error-icon"></i> 
      <h1 class="error-code">503</h1>
      <h2 class="fw-bold mb-3">Perkhidmatan Tidak Tersedia</h2>
      <p class="text-muted mb-4 lead">Sistem sedang diselenggara atau pelayan sedang sibuk. Sila cuba lagi sebentar lagi.</p>
      <button onclick="window.location.reload();" class="btn btn-primary btn-lg px-4 shadow-sm">
        <i class="fas fa-sync-alt me-2"></i>Muat Semula Halaman
      </button>
    </div>
  </main>
</body>
</html>
