<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Permohonan | JANS</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold fs-3 d-flex align-items-center" href="/">
        <img src="/images/logo3.png" alt="Logo JANS" style="height: 60px; width: auto; margin-right: 14px;">
        <span class="d-flex flex-column align-items-start">
          <span class="fw-bold" style="font-size: 1.6rem; line-height: 1;">JANS</span>
          <span class="text-white-50" style="font-size: 0.8rem; line-height: 1.1; letter-spacing: 0.04em; margin-top: 3px;">Jabatan Air Negeri Sabah</span>
        </span>
      </a>
    </div>
  </nav>

  <main class="flex-grow-1 py-5">
    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-lg-9">
          <div class="card shadow border-0 rounded-4 form-card">
            <div class="card-body p-5">
              <div class="text-center mb-5">
                <i class="fas fa-file-alt fa-3x text-primary mb-3"></i>
                <h1 class="h3 fw-bold">Borang Permohonan Kebenaran Akses</h1>
                <p class="text-muted">Sila isi maklumat dengan lengkap dan tepat.</p>
              </div>

              <div id="mesej"></div>

              <form id="borang">
                <div class="row g-4">
                  <div class="col-md-6">
                    <label for="applicantName" class="form-label fw-medium">Nama Penuh</label>
                    <input id="applicantName" name="applicantName" class="form-control" 
                           placeholder="Contoh: Amanda Lindrus" required>
                  </div>

                  <div class="col-md-6">
                    <label for="icNo" class="form-label fw-medium">No. Kad Pengenalan / Pasport</label>
                    <input id="icNo" name="icNo" class="form-control" 
                           placeholder="Contoh: 871234-12-1234" required>
                  </div>

                  <div class="col-md-6">
                    <label for="email" class="form-label fw-medium">E-mel</label>
                    <input id="email" type="email" name="email" class="form-control" 
                           placeholder="Contoh: amanda@email.com" required>
                  </div>

                  <div class="col-md-6">
                    <label for="phone" class="form-label fw-medium">No. Telefon</label>
                    <input id="phone" name="phone" class="form-control" 
                           placeholder="Contoh: 012-3456789" required>
                  </div>

                  <div class="col-md-6">
                    <label for="organisation" class="form-label fw-medium">Organisasi (jika ada)</label>
                    <input id="organisation" name="organisation" class="form-control" 
                           placeholder="Contoh: Syarikat ABC Sdn Bhd">
                  </div>

                  <div class="col-md-6">
                    <label for="visitorCount" class="form-label fw-medium">Bilangan Pelawat</label>
                    <input id="visitorCount" type="number" name="visitorCount" min="1" value="1" class="form-control" required>
                  </div>

                  <div class="col-md-6">
                    <label for="visitDate" class="form-label fw-medium">Tarikh Lawatan</label>
                    <input id="visitDate" type="date" name="visitDate" class="form-control" required>
                  </div>

                  <div class="col-md-6">
                    <label for="visitTime" class="form-label fw-medium">Masa Lawatan</label>
                    <input id="visitTime" type="time" name="visitTime" class="form-control" required>
                  </div>

                  <div class="col-md-6">
                    <label for="locationType" class="form-label fw-medium">Jenis Lokasi</label>
                    <select id="locationType" name="locationType" class="form-select">
                      <option value="LOJI">Loji Rawatan Air</option>
                      <option value="INTAKE">Intake</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label for="locationName" class="form-label fw-medium">Nama / Alamat Lokasi</label>
                    <input id="locationName" name="locationName" class="form-control" 
                           placeholder="Contoh: Loji Air Tuaran" required>
                  </div>

                  <div class="col-12">
                    <label for="vehicleNo" class="form-label fw-medium">No. Pendaftaran Kenderaan</label>
                    <input id="vehicleNo" name="vehicleNo" class="form-control" 
                           placeholder="Contoh: SAB 1234 W">
                  </div>

                  <div class="col-12">
                    <label for="purpose" class="form-label fw-medium">Tujuan Lawatan</label>
                    <textarea id="purpose" name="purpose" class="form-control" rows="4" 
                              placeholder="Contoh: Menjalankan kerja penyelenggaraan sistem paip" required></textarea>
                  </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 mt-5">
                  <i class="fas fa-paper-plane me-2"></i> Hantar Permohonan
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white py-4 text-center mt-auto">
    <div class="container-fluid">
      <p class="mb-0">&copy; 2026 Jabatan Air Negeri Sabah (JANS). Semua hak dilindungi.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
