<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maklumat Pelawat | JAS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body.internal-portal {
      font-size: 0.9rem;
    }
    .visitor-details-list {
      display: grid;
      gap: 14px;
    }
    .visitor-detail-card {
      overflow: hidden;
      border: 1px solid #dbe5ef;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
    }
    .visitor-detail-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      background: #eef6ff;
      border-bottom: 1px solid #dbe5ef;
      color: #00467f;
      font-weight: 700;
    }
    .visitor-detail-card-header i {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #d8ebff;
      color: #0d5ba5;
    }
    .visitor-detail-card-body {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      padding: 14px;
    }
    .visitor-detail-item {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid #edf1f5;
      border-radius: 8px;
      background: #f8fafc;
    }
    .visitor-detail-item-label {
      display: block;
      margin-bottom: 3px;
      color: #64748b;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .visitor-detail-item-value {
      overflow-wrap: anywhere;
      color: #1e293b;
      font-size: 0.88rem;
      font-weight: 500;
    }
    @media (max-width: 991.98px) {
      .visitor-detail-card-body {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
    @media (max-width: 767.98px) {
      .visitor-detail-card-body {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 576px) {
      .visitor-detail-card-body {
        grid-template-columns: minmax(0, 1fr);
      }
    }
  </style>
</head>
<body class="internal-portal d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark sticky-top internal-nav">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold fs-3 d-flex align-items-center" href="/">
        <img src="/images/logo3.png" alt="Logo JAS" style="height: 60px; width: auto; margin-right: 14px;">
        <span class="d-flex flex-column align-items-start">
          <span class="fw-bold" style="font-size: 1.6rem; line-height: 1;">JAS</span>
          <span class="text-white-50" style="font-size: 0.8rem; line-height: 1.1; letter-spacing: 0.04em; margin-top: 3px;">Jabatan Air Sabah</span>
        </span>
      </a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <a href="/profile.html" class="d-flex align-items-center gap-2 text-decoration-none" style="cursor: pointer;">
          <img id="navProfilePic" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%23e9ecef'/%3E%3Ccircle cx='100' cy='60' r='35' fill='%236c757d'/%3E%3Cellipse cx='100' cy='150' rx='50' ry='45' fill='%236c757d'/%3E%3C/svg%3E" alt="Profil" class="rounded-circle" style="width: 36px; height: 36px; object-fit: cover; border: 2px solid white;">
          <span id="navUsername" class="text-light fw-500" style="font-size: 14px;"></span>
        </a>
        <form method="post" action="/logout" class="d-inline">
          <button type="submit" class="btn btn-outline-light btn-sm">Log keluar</button>
        </form>
      </div>
    </div>
  </nav>

  <main class="container-fluid internal-main flex-grow-1">
    <section class="mb-3 d-flex flex-wrap align-items-center justify-content-between gap-2">
      <div>
        <h1 class="h4 fw-bold text-dark mb-1">Maklumat Pelawat</h1>
        <p class="text-muted mb-0" id="pelawat-subtitle">Butiran penuh setiap pelawat bagi permohonan ini.</p>
      </div>
      <button type="button" class="btn btn-outline-secondary" id="btn-kembali">
        <i class="fas fa-arrow-left me-1"></i>Kembali
      </button>
    </section>

    <div id="pelawat-content">
      <div class="text-center text-muted py-5"><i class="fas fa-spinner fa-spin me-2"></i>Memuatkan...</div>
    </div>
  </main>

  <footer class="bg-dark text-white py-4 mt-auto">
    <div class="container-fluid text-center">
      <p class="mb-1 fw-semibold">Jabatan Air Sabah (JAS)</p>
      <p class="mb-0 text-white-50 small">Portal Dalaman Cawangan Pengeluaran</p>
    </div>
  </footer>
  <script src="/js/app.js"></script>
  <script>
    async function loadProfile() {
      try {
        const response = await fetch('/api/profile');
        if (!response.ok) return;
        const data = await response.json();
        document.querySelector('#navUsername').textContent = data.name;
        loadNavProfilePicture();
      } catch (error) {
        console.error('Error:', error);
      }
    }

    function loadNavProfilePicture() {
      const img = document.querySelector('#navProfilePic');
      fetch('/api/profile/picture')
        .then(response => {
          img.src = response.ok
            ? '/api/profile/picture?t=' + Date.now()
            : img.src;
        })
        .catch(() => {});
    }

    async function loadPelawat() {
      const container = document.querySelector('#pelawat-content');
      const nomborPermohonan = new URLSearchParams(location.search).get('no');

      if (!nomborPermohonan) {
        container.innerHTML = '<div class="alert alert-danger">Tiada nombor permohonan dinyatakan.</div>';
        return;
      }

      try {
        const res = await fetch(`/api/public/permohonan/${encodeURIComponent(nomborPermohonan)}`);
        if (!res.ok) throw new Error('Permohonan tidak ditemui');
        const data = await res.json();
        const pelawat = Array.isArray(data.pelawat) ? data.pelawat : [];

        const subtitle = document.querySelector('#pelawat-subtitle');
        if (subtitle) {
          subtitle.innerHTML = `Butiran penuh setiap pelawat bagi permohonan <strong>${esc(data.nomborPermohonan)}</strong> daripada <strong>${esc(data.organisation || '-')}</strong>.`;
        }

        container.innerHTML = `
          <div class="card shadow-sm dashboard-card portal-table-card">
            <div class="card-header bg-info text-white py-3">
              <h2 class="h5 mb-0"><i class="fas fa-users me-2"></i>Senarai Pelawat</h2>
            </div>
            <div class="card-body">
              <div class="visitor-details-list">
                ${pelawat.length ? pelawat.map((v, index) => `
                  <div class="visitor-detail-card">
                    <div class="visitor-detail-card-header"><i class="fas fa-user"></i><span>Pelawat ${index + 1}</span></div>
                    <div class="visitor-detail-card-body">
                      <div class="visitor-detail-item"><span class="visitor-detail-item-label">Nama</span><span class="visitor-detail-item-value">${esc(v.namaPenuh || '-')}</span></div>
                      <div class="visitor-detail-item"><span class="visitor-detail-item-label">No. Kad Pengenalan</span><span class="visitor-detail-item-value">${esc(v.noKadPengenalan || '-')}</span></div>
                      <div class="visitor-detail-item"><span class="visitor-detail-item-label">E-mel</span><span class="visitor-detail-item-value">${esc(v.email || '-')}</span></div>
                      <div class="visitor-detail-item"><span class="visitor-detail-item-label">Telefon</span><span class="visitor-detail-item-value">${esc(v.noTelefonBimbit || '-')}</span></div>
                      <div class="visitor-detail-item"><span class="visitor-detail-item-label">Jawatan</span><span class="visitor-detail-item-value">${esc(v.jawatan || '-')}</span></div>
                      <div class="visitor-detail-item"><span class="visitor-detail-item-label">No. Kenderaan</span><span class="visitor-detail-item-value">${esc(v.noPendaftaranKenderaan || '-')}</span></div>
                    </div>
                  </div>
                `).join('') : '<div class="p-3 text-muted">Tiada maklumat pelawat direkodkan.</div>'}
              </div>
            </div>
          </div>
        `;
      } catch (error) {
        container.innerHTML = `<div class="alert alert-danger">${esc(error.message || 'Gagal memuat maklumat pelawat.')}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadProfile();
      loadPelawat();

      document.querySelector('#btn-kembali').addEventListener('click', () => {
        const from = new URLSearchParams(location.search).get('from');
        const returnPage = from === 'pengarah' ? '/pengarah.html' : from === 'petugas' ? '/petugas.html' : null;
        if (returnPage) {
          location.href = returnPage;
        } else {
          history.back();
        }
      });
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
